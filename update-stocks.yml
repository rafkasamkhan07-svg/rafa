name: Update IDX stock data
on:
  workflow_dispatch:
  schedule:
    # Setiap jam pada hari kerja, kira-kira selama sesi perdagangan WIB (UTC 02-09).
    - cron: "0 2-9 * * 1-5"
permissions:
  contents: write
concurrency:
  group: update-idx-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas
      - name: Fetch latest available daily data
        run: python scripts/update_stocks.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- stocks-live.json; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks-live.json
          git commit -m "Update stock data automatically"
          git push
